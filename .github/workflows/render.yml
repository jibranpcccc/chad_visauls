name: Render 5 Unique Styles

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition to render"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - Five-S1-WhatIf
          - Five-S2-Bees
          - Five-S3-GPS
          - Five-S4-Silicon
          - Five-S5-Flamingo

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: Five-S1-WhatIf
            out: five-s1.mp4
          - id: Five-S2-Bees
            out: five-s2.mp4
          - id: Five-S3-GPS
            out: five-s3.mp4
          - id: Five-S4-Silicon
            out: five-s4.mp4
          - id: Five-S5-Flamingo
            out: five-s5.mp4
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event.inputs.composition == 'all' || github.event.inputs.composition == matrix.id }}

      - uses: actions/setup-node@v4
        if: ${{ github.event.inputs.composition == 'all' || github.event.inputs.composition == matrix.id }}
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: ${{ github.event.inputs.composition == 'all' || github.event.inputs.composition == matrix.id }}
        run: npm ci || npm install

      - name: Render ${{ matrix.id }}
        if: ${{ github.event.inputs.composition == 'all' || github.event.inputs.composition == matrix.id }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts "${{ matrix.id }}" "out/${{ matrix.out }}" --codec h264 --crf 18

      - name: Upload ${{ matrix.out }}
        if: ${{ github.event.inputs.composition == 'all' || github.event.inputs.composition == matrix.id }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: out/${{ matrix.out }}
          retention-days: 14
