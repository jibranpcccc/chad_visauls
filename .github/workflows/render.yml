name: Render Remotion Videos

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition to render (or 'all' for all 3 in parallel)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - Style1-WhatIf-SVG
          - Style2-Cartoon3D-Toon
          - Style3-RepoChad-Neon

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: Style1-WhatIf-SVG
            out: style1-whatif.mp4
          - id: Style2-Cartoon3D-Toon
            out: style2-cartoon3d.mp4
          - id: Style3-RepoChad-Neon
            out: style3-repochad.mp4
    if: ${{ github.event.inputs.composition == 'all' || github.event.inputs.composition == '' || github.event.inputs.composition == matrix.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Render ${{ matrix.id }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts "${{ matrix.id }}" "out/${{ matrix.out }}" --codec h264 --crf 18

      - name: Upload ${{ matrix.out }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: out/${{ matrix.out }}
          retention-days: 14
