name: Render Remotion Videos

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition ID to render"
        required: true
        default: "AllStyles-Reel"
        type: choice
        options:
          - AllStyles-Reel
          - Style1-WhatIf-SVG
          - Style2-Cartoon3D-Toon
          - Style3-RepoChad-Neon

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Render ${{ github.event.inputs.composition || 'AllStyles-Reel' }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts "${{ github.event.inputs.composition || 'AllStyles-Reel' }}" "out/${{ github.event.inputs.composition || 'AllStyles-Reel' }}.mp4" --codec h264 --crf 18

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/*.mp4
          retention-days: 14
